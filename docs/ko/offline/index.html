&lt;div lang=&quot;en&quot;&gt;&lt;h2&gt;오프라인 상태입니다&lt;/h2&gt;
&lt;p&gt;열려고 한 페이지가 아직 캐시되지 않았으며, 브라우저가 현재 네트워크에 접근할 수 없습니다.&lt;/p&gt;
&lt;p&gt;이전에 방문한 모든 페이지는 여전히 탐색할 수 있습니다. 해당 페이지는 로컬 &lt;strong&gt;서비스 워커 캐시&lt;/strong&gt;에 보관되어 있습니다.&lt;/p&gt;
