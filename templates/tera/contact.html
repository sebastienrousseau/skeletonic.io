{% extends "base.html" %}

{% block body_class %}page-contact{% endblock %}

{% block hero %}
<header class="site-hero" style="padding:4.5rem 1.5rem 2.5rem;">
  <h1 style="font-size:clamp(2rem,4vw,2.75rem);">{{ page.title | default(value="Contact") }}</h1>
  {% if page.description %}<p>{{ page.description }}</p>{% endif %}
</header>
{% endblock %}

{% block content %}
{{ page.content | safe }}

<form
  action="https://formspree.io/f/xvgpwnow"
  method="POST"
  aria-label="Contact form">
  <label for="contact-name">{{ t_form_name }}</label>
  <input type="text" id="contact-name" name="name" required autocomplete="name">

  <label for="contact-email">{{ t_form_email }}</label>
  <input type="email" id="contact-email" name="_replyto" required autocomplete="email">

  <label for="contact-subject">{{ t_form_subject }}</label>
  <input type="text" id="contact-subject" name="_subject" required>

  <label for="contact-message">{{ t_form_message }}</label>
  <textarea id="contact-message" name="message" rows="6" required></textarea>

  <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none" aria-hidden="true">
  <input type="hidden" name="_next" value="https://skeletonic.io{{ lang_prefix }}/{{ s_contact }}/">

  <p>
    <button type="submit" class="hero-cta" style="border:none;cursor:pointer;font-family:inherit;">{{ t_form_send }}</button>
  </p>
</form>
{% endblock %}
