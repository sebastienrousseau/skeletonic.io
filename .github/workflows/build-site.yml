name: Build site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Repo-wide default of read-only; the deploy job opts up to write
# what it needs (id-token for Pages OIDC, pages: write for the deploy).
permissions:
  contents: read

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Shokunin SSG
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Shokunin SSG (v0.0.34)
        run: |
          cargo install --locked --git https://github.com/sebastienrousseau/shokunin --tag v0.0.34 ssg \
            || cargo install --locked --version 0.0.34 ssg

      - name: Build site (all locales)
        run: bash scripts/build-i18n.sh

      - name: Write CNAME (custom domain for GitHub Pages)
        run: echo 'skeletonic.com' > docs/CNAME

      - name: Verify no Bootstrap or other CSS framework leaked into the build
        run: |
          set -e
          # Only check CSS/JS assets — HTML content legitimately mentions
          # other frameworks in comparison tables.
          #
          # Match framework *assets*, not bare names: docs/js/main.js
          # legitimately carries "bootstrap"/"bulma"/"tailwind" as data
          # keys for the framework-size comparison calculator, and the
          # bare-name pattern flagged that as a leak.
          if grep -RIEi \
               '(bootstrap|tailwind|bulma|foundation|tachyons)(\.min)?\.(css|js)|cdn[^"'"'"' ]*(bootstrap|tailwind|bulma)' \
               --include='*.css' --include='*.js' docs/; then
            echo "::error::Foreign CSS framework detected in build output"
            exit 1
          fi
          echo "OK — only skeletonic CSS in build output"

      - name: Lighthouse CI audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12
        with:
          configPath: .github/lighthouse-ci.json
          uploadArtifacts: true

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: >-
            --root-dir ${{ github.workspace }}/docs
            --exclude formspree.io
            --exclude paypal.com
            --exclude validator.schema.org
            --exclude '^https://skeletonic\.io'
            --exclude '^https://(www\.)?skeletonic\.com'
            --exclude '^https?://(www\.)?npmjs\.com'
            docs/**/*.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
