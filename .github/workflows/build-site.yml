name: Build site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Repo-wide default of read-only; the deploy job opts up to write
# what it needs (id-token for Pages OIDC, pages: write for the deploy).
permissions:
  contents: read

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build with Shokunin SSG
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Shokunin SSG (v0.0.34)
        run: |
          cargo install --locked --git https://github.com/sebastienrousseau/shokunin --tag v0.0.34 ssg \
            || cargo install --locked --version 0.0.34 ssg

      - name: Build site (all locales)
        run: bash scripts/build-i18n.sh

      - name: Write CNAME (custom domain for GitHub Pages)
        run: echo 'skeletonic.com' > docs/CNAME

      - name: Verify no Bootstrap or other CSS framework leaked into the build
        run: |
          set -e
          # Only check CSS/JS assets — HTML content legitimately mentions
          # other frameworks in comparison tables.
          if grep -RIEi 'bootstrap|tailwind|bulma|foundation\.css|tachyons\.css' \
               --include='*.css' --include='*.js' docs/; then
            echo "::error::Foreign CSS framework detected in build output"
            exit 1
          fi
          echo "OK — only skeletonic CSS in build output"

      - name: Lighthouse CI audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12
        with:
          configPath: .github/lighthouse-ci.json
          uploadArtifacts: true

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411  # v2
        with:
          args: >-
            --root-dir ${{ github.workspace }}/docs
            --exclude formspree.io
            --exclude paypal.com
            --exclude validator.schema.org
            --exclude '^https://skeletonic\.io'
            --exclude '^https://(www\.)?skeletonic\.com'
            --exclude '^https?://(www\.)?npmjs\.com'
            docs/**/*.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
